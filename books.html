
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieve and Display JSON Data</title>
</head>
<body>
    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstTitle">Loading...</p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor">Loading...</p>

    <h2>Genres by Book</h2>
    <div id="genres"></div>

    <p id="status" role="status" aria-live="polite"></p>

    <script>
        async function loadBooks() {
            const status = document.getElementById("status");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to load books.json");
                }

                const data = await response.json();

                document.getElementById("firstTitle").textContent =
                    data.books[0].title;

                document.getElementById("secondAuthor").textContent =
                    data.books[1].author;

                const genresDiv = document.getElementById("genres");

                data.books.forEach(function(book) {
                    const heading = document.createElement("h3");
                    heading.textContent = book.title;

                    const paragraph = document.createElement("p");
                    paragraph.textContent = book.genres.join(", ");

                    genresDiv.appendChild(heading);
                    genresDiv.appendChild(paragraph);
                });

                status.textContent = "Books loaded successfully!";
            } catch (error) {
                status.textContent =
                    "Error: Unable to load book data. Check books.json.";
                console.error(error);
            }
        }

        loadBooks();
    </script>
</body>
</html>
