
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript and jQuery</title>

    <!-- jQuery 4.0.0 Full Build -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>
</head>
<body>
    <h1>Compare JavaScript and jQuery</h1>

    <h2>Operation A: Change Text</h2>
    <div id="myElement">Original Text</div>

    <h2>Operation B: Add CSS Class</h2>
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <h2>Operation C: Button Click Event</h2>
    <button id="myButton" type="button">Click me</button>

    <script>
        // (a) Change the text using jQuery
        $("#myElement").text("Modified Text");

        // (b) Add the CSS class using jQuery
        $("#myDIV").addClass("myStyle");

        // (c) Handle the button click using jQuery
        $("#myButton").on("click", function() {
            alert("Button clicked!");
        });
    </script>
</body>
</html>
